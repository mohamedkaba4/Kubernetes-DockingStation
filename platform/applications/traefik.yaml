apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      releaseName: traefik
      values: |
        deployment:
          replicas: 2

        service:
          type: ClusterIP

        providers:
          kubernetesIngress:
            enabled: true

        ingressClass:
          enabled: true
          isDefaultClass: false

        ingressRoute:
          dashboard:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
