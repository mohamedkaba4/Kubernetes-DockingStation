apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mohamedkaba4/Kubernetes-DockingStation
    targetRevision: main
    path: apps/aiops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
