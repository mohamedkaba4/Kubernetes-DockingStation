apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mavencrest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mohamedkaba4/Kubernetes-DockingStation.git
    targetRevision: main
    path: apps/mavencrest
  destination:
    server: https://kubernetes.default.svc
    namespace: mavencrest
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
