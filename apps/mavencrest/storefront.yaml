apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: mavencrest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: storefront
    spec:
      imagePullSecrets:
        - name: acr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: storefront
      containers:
        - name: storefront
          image: acrmavencrestproda1wl.azurecr.io/mavencrest-storefront:k8s-arm64-v1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: storefront-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: mavencrest
spec:
  type: NodePort
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
