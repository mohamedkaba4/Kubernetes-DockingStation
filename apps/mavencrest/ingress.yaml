apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: mavencrest
spec:
  ingressClassName: traefik
  rules:
    - host: k8.mavencrest.shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
