image:
  repository: ghcr.io/mohamedkaba4/mavencrest-storefront
  tag: "v1"
  pullSecret: ghcr-pull

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30081

ingress:
  enabled: true
  className: traefik
  host: k8.mavencrest.shop

autoscaling:
  minReplicas: 1
  maxReplicas: 4
  cpuUtilization: 60

pdb:
  minAvailable: 1

admin:
  enabled: false
  image:
    repository: ghcr.io/mohamedkaba4/mavencrest-admin
    tag: "v1"
  imagePullSecret: ghcr-pull
  envSecret: admin-env
  port: 3001
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

admin:
  enabled: true
  image:
    repository: ghcr.io/mohamedkaba4/mavencrest-admin
    tag: "v1"
  imagePullSecret: ghcr-pull
  envSecret: admin-env
  port: 3001
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
