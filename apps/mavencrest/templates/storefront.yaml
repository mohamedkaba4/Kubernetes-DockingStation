apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: mavencrest
spec:
  selector:
    matchLabels:
      app: storefront
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: storefront
    spec:
      imagePullSecrets:
        - name: {{ .Values.storefront.image.pullSecret }}
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2 
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: storefront
      containers:
        - name: storefront
          image: "{{ .Values.storefront.image.repository }}:{{ .Values.storefront.image.tag }}"
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: storefront-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: mavencrest
spec:
  type: {{ .Values.storefront.service.type }}
  selector:
    app: storefront
  ports:
    - port: {{ .Values.storefront.service.port }}
      targetPort: {{ .Values.storefront.service.targetPort }}
      {{- if eq .Values.storefront.service.type "NodePort" }}
      nodePort: {{ .Values.storefront.service.nodePort }}
      {{- end }}
