{{- if .Values.storefront.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: mavencrest
spec:
  ingressClassName: {{ .Values.storefront.ingress.className }}
  rules:
    - host: {{ .Values.storefront.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
{{- end }}
