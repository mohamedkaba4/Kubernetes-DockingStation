{{- if .Values.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      imagePullSecrets:
        - name: {{ .Values.admin.imagePullSecret }}
      containers:
        - name: admin
          image: "{{ required "Admin image repository is required" .Values.admin.image.repository }}:{{ required "Admin image tag is required" .Values.admin.image.tag }}"
          ports:
            - containerPort: {{ .Values.admin.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.admin.envSecret }}
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.admin.port }}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.admin.port }}
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.admin.port }}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: admin
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: {{ .Values.admin.port }}
{{- end }}
