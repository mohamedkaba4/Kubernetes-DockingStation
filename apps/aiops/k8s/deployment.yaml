apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiops-reports
  namespace: aiops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-investigator
  namespace: aiops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiops-investigator
  template:
    metadata:
      labels:
        app: aiops-investigator
    spec:
      serviceAccountName: aiops-investigator
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: investigator
          image: ghcr.io/mohamedkaba4/aiops-investigator:v0.3
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TARGET_NAMESPACE
              value: mavencrest
            - name: REPORT_DIR
              value: /reports
            - name: AI_ENABLED
              value: "true"
            - name: AI_MODEL
              value: gpt-4.1-mini
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-openai
                  key: OPENAI_API_KEY
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-webhook
                  key: WEBHOOK_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: reports
              mountPath: /reports
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: aiops-reports
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-investigator
  namespace: aiops
spec:
  selector:
    app: aiops-investigator
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
